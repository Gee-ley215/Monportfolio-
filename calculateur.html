<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #dbe4ec;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ece6e6;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #615b5b;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #151a16;
            color: rgb(231, 222, 222);
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #218838;
        }

        #erreurs {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            font-size: 14px;
            display: none;
        }

        #resultats {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef2f5;
            border-radius: 6px;
            display: none;
        }

        .resultat-ligne {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #444;
        }

        .resultat-ligne.principale {
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
    </style> 
</head>
<body>
    <div class="container">
        <h2>Calculateur de Prêt</h2>

        <form name="formPret" onsubmit="return false;">
            <div class="form-group">
                <label for="montant">Montant du prêt ($) :</label>
                <input type="number" id="montant" name="montant" placeholder="Ex: 200000" step="any">
            </div>

            <div class="form-group">
                <label for="taux">Taux d'intérêt annuel (%) :</label>
                <input type="number" id="taux" name="taux" placeholder="Ex: 3.5" step="any">
            </div>

            <div class="form-group">
                <label for="duree">Durée (en années) :</label>
                <input type="number" id="duree" name="duree" placeholder="Ex: 20" step="any">
            </div>

            <button type="button" onclick="calculerPret()">Calculer</button>
        </form>

        <div id="erreurs"></div>

        <div id="resultats">
            <div class="resultat-ligne principale">
                <span>Mensualité :</span>
                <span id="mensualite">-</span>
            </div>
            <div class="resultat-ligne">
                <span>Coût total du prêt :</span>
                <span id="coutTotal">-</span>
            </div>
            <div class="resultat-ligne">
                <span>Total des intérêts :</span>
                <span id="totalInterets">-</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script> 

</body>
</html>
